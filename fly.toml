app = "chalk-ryanhenderson"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  DATABASE_PATH = "/app/data/chalk.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    # Defense-in-depth hardening called out in SECURITY_WRITEUP.md §6.
    X-Content-Type-Options = "nosniff"

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/api/health"

[mounts]
  source = "chalk_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
